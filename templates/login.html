{% extends "base.html" %}
{% block content %}
<div class="card login-card">
    <h1>학생 입장</h1>
    <p class="muted">학번과 이름을 입력하면 해당 학번의 코멘트 기록에 연결됩니다.</p>
    <form method="post">
        <label>학번</label>
        <input name="student_number" inputmode="numeric" maxlength="20" placeholder="예: 2107" required autofocus>
        <label>이름</label>
        <input name="name" maxlength="30" placeholder="예: 홍길동" required>
        <button type="submit">입장하기</button>
    </form>
    <a class="teacher-link" href="{{ url_for('teacher_login') }}">선생님 관리 화면</a>
</div>
{% endblock %}
